name: Telegram Push Notification

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    environment: telegram
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "::error::TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID must be configured as secrets in the telegram GitHub environment."
            exit 1
          fi
          short_sha="${COMMIT:0:7}"
          commit_url="https://github.com/${REPOSITORY}/commit/${COMMIT}"
          raw_message="${COMMIT_MESSAGE:0:900}"
          if [[ -z "${raw_message//[[:space:]]/}" ]]; then
            raw_message="Manual workflow run"
          fi
          escaped_message=$(printf '%s' "$raw_message" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')
          text=$(printf '<b>EduCore - Push Notification</b>\n\nRepository: %s\nBranch: %s\nAuthor: %s\nCommit: <a href="%s">%s</a>\n\n%s' \
            "$REPOSITORY" "$BRANCH" "$ACTOR" "$commit_url" "$short_sha" "$escaped_message")
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true"
